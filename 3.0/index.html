<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>明日のメイクを決めよう！ | 投票アプリ</title>
    <style>
        :root {
            --primary-color: #ff8fa3;
            --secondary-color: #fff0f3;
            --text-color: #4a4a4a;
            --bg-color: #fcfcfc;
            --card-bg: #ffffff;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        header h1 {
            color: var(--primary-color);
            font-size: 2rem;
            margin-bottom: 10px;
        }

        header p {
            color: #888;
        }

        main {
            max-width: 900px;
            margin: 0 auto;
        }

        .vote-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 50px;
        }

        .makeup-card {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            box-shadow: var(--shadow);
            transition: transform 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .makeup-card:hover {
            transform: translateY(-5px);
        }

        .makeup-image {
            width: 100%;
            height: 150px;
            background: var(--secondary-color);
            border-radius: 10px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
        }

        .makeup-name {
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 15px;
        }

        .vote-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: opacity 0.2s;
        }

        .vote-btn:hover {
            opacity: 0.8;
        }

        .vote-btn:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        .results-section {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 15px;
            box-shadow: var(--shadow);
        }

        .results-section h2 {
            text-align: center;
            margin-bottom: 20px;
            color: var(--primary-color);
        }

        .result-item {
            margin-bottom: 15px;
        }

        .result-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }

        .progress-bar {
            height: 12px;
            background-color: var(--secondary-color);
            border-radius: 6px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background-color: var(--primary-color);
            width: 0%;
            transition: width 0.5s ease-out;
        }

        footer {
            text-align: center;
            margin-top: 50px;
            color: #aaa;
            font-size: 0.8rem;
        }

        /* 投票後の演出 */
        .voted-msg {
            display: none;
            text-align: center;
            color: #2ecc71;
            font-weight: bold;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<header>
    <h1>明日のメイクを決めよう！</h1>
    <p>明日私がするメイクのスタイルを投票で選んでください✨</p>
</header>

<main>
    <div class="vote-grid">
        <!-- A. ナチュラル -->
        <div class="makeup-card">
            <div>
                <div class="makeup-image">🌿</div>
                <div class="makeup-name">ピュア・ナチュラル</div>
            </div>
            <button class="vote-btn" onclick="castVote('natural')">このメイクに投票</button>
        </div>

        <!-- B. 韓国風 -->
        <div class="makeup-card">
            <div>
                <div class="makeup-image">✨</div>
                <div class="makeup-name">華やか韓国ドル風</div>
            </div>
            <button class="vote-btn" onclick="castVote('korean')">このメイクに投票</button>
        </div>

        <!-- C. モード -->
        <div class="makeup-card">
            <div>
                <div class="makeup-image">💄</div>
                <div class="makeup-name">クールなスモーキーモード</div>
            </div>
            <button class="vote-btn" onclick="castVote('mode')">このメイクに投票</button>
        </div>

        <!-- D. 純欲 -->
        <div class="makeup-card">
            <div>
                <div class="makeup-image">🍑</div>
                <div class="makeup-name">ぷっくり純欲メイク</div>
            </div>
            <button class="vote-btn" onclick="castVote('junyoku')">このメイクに投票</button>
        </div>
    </div>

    <div id="votedMessage" class="voted-msg">投票ありがとうございます！</div>

    <aside class="results-section">
        <h2>現在の投票結果</h2>
        <div id="resultsContainer">
            <!-- 結果がここに動的に生成されます -->
            <div class="result-item">
                <div class="result-label"><span>ピュア・ナチュラル</span><span id="count-natural">0票</span></div>
                <div class="progress-bar"><div id="bar-natural" class="progress-fill"></div></div>
            </div>
            <div class="result-item">
                <div class="result-label"><span>華やか韓国ドル風</span><span id="count-korean">0票</span></div>
                <div class="progress-bar"><div id="bar-korean" class="progress-fill"></div></div>
            </div>
            <div class="result-item">
                <div class="result-label"><span>クールなスモーキーモード</span><span id="count-mode">0票</span></div>
                <div class="progress-bar"><div id="bar-mode" class="progress-fill"></div></div>
            </div>
            <div class="result-item">
                <div class="result-label"><span>ぷっくり純欲メイク</span><span id="count-junyoku">0票</span></div>
                <div class="progress-bar"><div id="bar-junyoku" class="progress-fill"></div></div>
            </div>
        </div>
    </aside>
</main>

<footer>
    <p>&copy; 2026 明日のメイク投票アプリ</p>
</footer>

<script>
    // 画面更新（サーバーからデータを取得）
    async function updateDisplay() {
        try {
            const response = await fetch('/votes');
            const data = await response.json();
            
            // データをマッピング (サーバーに無い項目は0)
            const results = {
                natural: 0,
                korean: 0,
                mode: 0,
                junyoku: 0
            };
            
            data.forEach(item => {
                if (results.hasOwnProperty(item.option)) {
                    results[item.option] = item.count;
                }
            });

            const total = Object.values(results).reduce((a, b) => a + b, 0);
            
            for (const key in results) {
                const count = results[key];
                const percent = total === 0 ? 0 : (count / total) * 100;
                
                document.getElementById(`count-${key}`).innerText = `${count}票 (${Math.round(percent)}%)`;
                document.getElementById(`bar-${key}`).style.width = `${percent}%`;
            }
        } catch (err) {
            console.error('Error fetching votes:', err);
        }
    }

    // 投票処理（サーバーへ送信）
    async function castVote(type) {
        try {
            const response = await fetch('/vote', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ option: type })
            });

            if (response.ok) {
                // ローカルに投票済みフラグを保存（簡易重複防止）
                localStorage.setItem('hasVoted', 'true');
                
                // メッセージ表示
                document.getElementById('votedMessage').style.display = 'block';
                
                // ボタンを無効化
                disableButtons();
                
                // 表示を更新
                updateDisplay();
            }
        } catch (err) {
            console.error('Error casting vote:', err);
            alert('投票に失敗しました。');
        }
    }

    function disableButtons() {
        const buttons = document.querySelectorAll('.vote-btn');
        buttons.forEach(btn => btn.disabled = true);
    }

    // 初回表示
    updateDisplay();

    // 既に投票済みかチェック
    if (localStorage.getItem('hasVoted')) {
        disableButtons();
        document.getElementById('votedMessage').innerText = '既に投票済みです。';
        document.getElementById('votedMessage').style.display = 'block';
    }
</script>

</body>
</html>
